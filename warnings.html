  <style>
    body {
      font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
      background: linear-gradient(135deg, #f0f2f5 0%, #d8dce8 100%);
      color: #1a1c2e;
      text-align: center;
      padding: 32px 16px 60px 16px;
      min-height: 100vh;

    body { top: 0 !important; }
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    .goog-te-balloon-frame { display: none !important; }

    .goog-te-banner-frame, iframe.goog-te-banner-frame, .goog-te-banner-frame.skiptranslate { display: none !important; visibility: hidden !important; height: 0 !important; }
    #goog-gt-tt, .goog-te-balloon-frame { display: none !important; visibility: hidden !important; }
    .goog-text-highlight { background: transparent !important; box-shadow: none !important; }
    #google_translate_element, #translateToggleBtn { top: auto !important; right: 8px !important; bottom: 8px !important; }

    /* Top Tabs */
    .tab-nav {
      background: rgba(70, 80, 105, 0.92);
      border-bottom: 1px solid #c0c4d8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      position: sticky; top: 0; z-index: 1000;
    }
    .tab-nav-container { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; padding: 0 16px; overflow: visible; flex-wrap: wrap; }
    .nav-brand { font-size: 20px; font-weight: 700; color: #a5b4fc; padding: 16px 0; margin-right: 32px; white-space: nowrap; display: flex; align-items: center; gap: 8px; text-shadow: 0 2px 8px #000a; }
    .nav-brand img { height: 32px; width: auto; }
    .tab-buttons {
      display: flex; gap: 4px; flex: 1; overflow-x: auto; overflow-y: hidden; align-items: center; height: 100px;
    }
    .tab-btn {
      padding: 12px 16px; background: none; border: none; color: #c7cce0;
      font-size: 28px; font-weight: 500; border-bottom: 3px solid transparent;
      transition: all 0.2s; white-space: nowrap; text-decoration: none; display: block;
      cursor: pointer; position: relative;
    }
    .tab-btn:hover { color: #4f46e5; background: #f0f2f5; }
    .tab-btn.active { color: #a5b4fc; border-bottom-color: #a5b4fc; }
    .tab-btn[title]:hover::after {
      content: attr(title); position: absolute; top: -42px; left: 50%; transform: translateX(-50%);
      background: #f0f2f5; color: #4f46e5; padding: 6px 12px; border-radius: 4px;
      font-size: 12px; white-space: nowrap; z-index: 1001; border: 1px solid #c0c4d8; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .tab-btn .tab-icon { display: block; margin: 0 auto; height: 40px; width: auto; font-size: 16px; line-height: 1.2; font-weight: 500; white-space: nowrap; filter: drop-shadow(0 2px 8px #000a); }

    /* Container */
    .main-content {
      max-width: 900px; margin: 0 auto; padding: 16px;
      background: rgba(82, 90, 114, 0.93); border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25); text-align: left;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; color: #a5b4fc; text-shadow: 0 2px 8px #000a; text-align: center; }
    .site-logo { width: 56px; height: 56px; display: block; margin: 0 auto 6px auto; }
    .subtitle { text-align: center; color: #d1d5e6; margin-bottom: 16px; font-size: 0.85em; }

    /* Content Tabs */
    .content-tabs {
      display: flex; gap: 0; margin-bottom: 18px; border-bottom: 2px solid rgba(255,255,255,0.25);
    }
    .content-tabs button {
      flex: 1; background: none; border: none; padding: 12px 8px; cursor: pointer;
      font-size: 0.92em; font-weight: 600; color: #d8dce8;
      border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s;
    }
    .content-tabs button:hover { color: #a5b4fc; background: rgba(79,70,229,0.08); }
    .content-tabs button.active { color: #a5b4fc; border-bottom-color: #a5b4fc; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; min-width: 160px; }

    /* Warning Form */
    .warn-form {
      background: rgba(255,248,225,0.1); border: 1px solid #ffb300;
      border-radius: 12px; padding: 16px; margin-bottom: 20px;
    }
    .warn-form h3 { color: #ff5252; margin-bottom: 12px; font-size: 1em; }
    .form-grid {
      display: grid; gap: 10px; margin-bottom: 12px; grid-template-columns: 1fr 1fr;
    }
    .form-grid.full { grid-template-columns: 1fr; }
    .form-grid label {
      display: block; font-size: 0.72em; font-weight: 700; color: #a5b4fc;
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .form-grid select, .form-grid input, .form-grid textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #c0c4d8; border-radius: 8px;
      font-size: 1em; background: #f0f2f5; color: #2c2f45;
      -webkit-appearance: none; appearance: none;
    }
    .form-grid textarea { resize: vertical; min-height: 60px; font-family: inherit; }
    .form-grid select:focus, .form-grid input:focus, .form-grid textarea:focus {
      outline: none; border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,0.2);
    }
    .btn {
      background: #4f46e5; color: #f0f2f5; border: none; border-radius: 8px;
      padding: 12px 24px; cursor: pointer; font-weight: 700; font-size: 1em;
      width: 100%; touch-action: manipulation;
    }
    .btn:hover { background: #6366f1; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.danger { background: #c62828; }
    .btn.danger:hover { background: #b71c1c; }

    /* Summary Cards */
    .summary-section { margin-top: 20px; }
    .summary-section h3 { color: #a5b4fc; margin-bottom: 10px; font-size: 1em; }
    .summary-table-wrap { overflow-x: auto; }
    .summary-table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
    .summary-table th {
      background: rgba(79,70,229,0.2); color: #a5b4fc; padding: 10px 8px;
      text-align: left; border-bottom: 2px solid #4f46e5; cursor: pointer;
      white-space: nowrap; user-select: none; -webkit-user-select: none;
    }
    .summary-table th:hover { background: rgba(79,70,229,0.3); }
    .summary-table th .sort-arrow { font-size: 0.7em; margin-left: 4px; opacity: 0.4; }
    .summary-table th.sorted .sort-arrow { opacity: 1; }
    .summary-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #d8dce8; }
    .summary-table tr:hover { background: rgba(79,70,229,0.08); }
    .summary-table .warn-badge {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 0.8em; font-weight: 700; color: #fff; min-width: 28px; text-align: center;
    }
    .warn-badge.w1 { background: #ffa000; }
    .warn-badge.w2 { background: #e67e22; }
    .warn-badge.w3 { background: #c62828; }
    .warn-badge.w4 { background: #7b1fa2; }
    .summary-table .action-btns { display: flex; gap: 4px; }
    .summary-table .action-btns button {
      background: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      padding: 3px 6px; cursor: pointer; font-size: 0.8em;
    }
    .summary-table .action-btns .clear-btn { border-color: #c62828; color: #ff5252; }
    .summary-table .action-btns button:hover { background: rgba(79,70,229,0.15); }
    .summary-table .type-tags { font-size: 0.75em; color: #d1d5e6; }

    /* Warning History */
    .history-section { margin-top: 24px; }
    .history-section h3 { color: #a5b4fc; margin-bottom: 10px; font-size: 1em; }
    .filter-row {
      display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .filter-row select, .filter-row input {
      padding: 8px 10px; border: 1px solid #c0c4d8; border-radius: 6px;
      font-size: 0.9em; background: #f0f2f5; color: #2c2f45; flex: 1; min-width: 140px;
    }
    .warn-list { list-style: none; padding: 0; }
    .warn-item {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 8px; position: relative;
    }
    .warn-item .warn-header {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px;
    }
    .warn-item .warn-num {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 0.75em; font-weight: 700; color: #fff;
    }
    .warn-num.w1 { background: #ffa000; }
    .warn-num.w2 { background: #e67e22; }
    .warn-num.w3 { background: #c62828; }
    .warn-num.w4 { background: #7b1fa2; }
    .warn-item .warn-name { font-weight: 700; font-size: 0.95em; color: #f0f2f5; }
    .warn-item .warn-type {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 0.75em; background: rgba(79,70,229,0.2); color: #a5b4fc; font-weight: 600;
    }
    .warn-item .warn-detail { font-size: 0.82em; color: #d1d5e6; margin-top: 4px; }
    .warn-item .warn-comment { font-size: 0.85em; color: #f0f2f5; margin-top: 6px; padding: 6px 10px; background: rgba(255,255,255,0.06); border-radius: 6px; font-style: italic; }
    .warn-item .delete-btn {
      position: absolute; top: 10px; right: 10px; background: none; border: none;
      color: rgba(255,255,255,0.3); cursor: pointer; font-size: 1.1em; padding: 4px;
    }
    .warn-item .delete-btn:hover { color: #ff5252; }

    /* Login Gate */
    .login-gate {
      max-width: 500px; margin: 80px auto; text-align: center;
      background: rgba(82, 90, 114, 0.93); border-radius: 16px;
      padding: 40px 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }
    .login-gate h2 { color: #a5b4fc; margin-bottom: 12px; }
    .login-gate p { color: #d1d5e6; margin-bottom: 20px; }

    /* Loading & Toast */
    .loading { text-align: center; padding: 30px; color: #d1d5e6; }
    .spinner {
      display: inline-block; width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.2); border-top-color: #4f46e5;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 3000;
      background: #f0f2f5; color: #2c2f45; padding: 12px 20px;
      border-radius: 8px; font-size: 0.9em; display: none;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .toast.success { border-left: 4px solid #2e7d32; }
    .toast.error { border-left: 4px solid #c62828; }
    .no-data { text-align: center; color: #d1d5e6; padding: 20px; font-style: italic; }

    /* Responsive navigation */
    .tab-label.mobile-only { display: none; }
    .tab-icon.desktop-only { display: block; margin: 0 auto; height: 40px; width: auto; }
    .hamburger {
      display: none; flex-direction: column; gap: 4px;
      background: none; border: none; cursor: pointer; padding: 8px;
    }
    .hamburger span { display: block; width: 24px; height: 3px; background: #a5b4fc; border-radius: 2px; transition: all 0.2s; }

    /* Mobile */
    @media (max-width: 800px) {
      .tab-nav { position: fixed; top: 0; left: 0; right: 0; width: 100%; z-index: 9999; }
      .tab-nav-container { flex-wrap: wrap; padding: 8px; }
      .nav-brand { flex: 1; margin-right: 8px; font-size: 16px; padding: 8px 0; }
      .nav-brand img { height: 24px; width: 24px; }
      .hamburger { display: flex; order: 2; }
      .tab-buttons {
        flex-direction: column; align-items: stretch; max-height: 60vh; overflow-y: auto;
        background: #f0f2f5; position: absolute; top: 60px; left: 0; right: 0; width: 100%;
        z-index: 10000; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.25); display: none; order: 10;
      }
      .tab-buttons.open { display: flex; }
      .tab-btn {
        font-size: 18px; padding: 18px 24px; border-bottom: 1px solid #c0c4d8;
        display: flex; align-items: center; justify-content: flex-start; background: none; height: auto;
      }
      .tab-btn:last-child { border-bottom: none; }
      .tab-label.mobile-only { display: inline; }
      .tab-icon.desktop-only { display: none; }
      #signedInUserBadge, #logoutBtn, #signInManageBtn {
        order: 3; margin: 4px 0 4px auto !important; font-size: 11px !important; padding: 6px 8px !important;
      }
      body { padding-top: 100px; }
      .main-content { padding: 14px 10px; border-radius: 12px; }
      h1 { font-size: 1.3em; }
      .form-grid { grid-template-columns: 1fr; }
      .btn { padding: 14px 24px; font-size: 1.05em; }
    }

    @media (min-width: 801px) {
      .tab-label.mobile-only { display: none; }
      .tab-icon.desktop-only { display: block; }
      .tab-buttons {
        flex-direction: row; align-items: center; position: static; max-height: none;
        overflow-y: visible; background: none; box-shadow: none; border-radius: 0; display: flex !important;
      }
      .tab-btn { font-size: 28px; padding: 12px 16px; border-bottom: 3px solid transparent; display: block; justify-content: center; }
      .hamburger { display: none; }
    }
  </style>
</head>

<!-- Google Translate Widget -->
<div id="google_translate_element" style="position:fixed;bottom:8px;right:8px;z-index:7000;"></div>
<button id="translateToggleBtn" type="button" aria-label="Toggle translation" style="position:fixed;bottom:8px;right:8px;z-index:7001;display:none;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid #c0c4d8;border-radius:8px;background:#f0f2f5;color:#4f46e5;font-size:18px;cursor:pointer;">🌐</button>
<style>
  @media (max-width: 800px) {
    #google_translate_element { max-width: 0; overflow: hidden; opacity: 0; pointer-events: none; transition: max-width 0.2s ease, opacity 0.2s ease; }
    body.translate-open #google_translate_element { max-width: 260px; opacity: 1; pointer-events: auto; }
    #translateToggleBtn { display: inline-flex !important; }
  }
  @media (min-width: 801px) { #translateToggleBtn { display: none !important; } }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const translateToggleBtn = document.getElementById('translateToggleBtn');
    const translateWidget = document.getElementById('google_translate_element');
    if (!translateToggleBtn || !translateWidget) return;
    translateToggleBtn.addEventListener('click', function (e) { e.stopPropagation(); document.body.classList.toggle('translate-open'); });
    document.addEventListener('click', function (e) {
      if (!document.body.classList.contains('translate-open')) return;
      if (translateWidget.contains(e.target) || translateToggleBtn.contains(e.target)) return;
      document.body.classList.remove('translate-open');
    });
  });
</script>

<script>
  let isLoggedIn = false;
  let currentUser = null;
  let allWarnings = [];
  let warningSummary = {};
  let memberNames = [];
  let warningTypes = [];

  // ===== HAMBURGER =====
  document.addEventListener('DOMContentLoaded', function () {
    const hamburger = document.getElementById('navHamburger');
    const navTabs = document.getElementById('navTabs');
    if (hamburger && navTabs) {
      hamburger.addEventListener('click', function () { navTabs.classList.toggle('open'); });
    }
  });

  // ===== AUTH =====
  function checkLoginState() {
    const token = (() => { try { return localStorage.getItem(AUTH_KEY); } catch (e) { return null; } })();
    const email = (() => { try { return localStorage.getItem(AUTH_EMAIL_KEY); } catch (e) { return null; } })();
    if (token && email) {
      isLoggedIn = true;
      currentUser = { email: email };
      updateLoginUI();
    }

    // Show/hide restricted nav tabs based on login
    const setRestrictedTabsVisibility = (isVisible) => {
      const displayValue = isVisible ? '' : 'none';
      ['events.html', 'members.html', 'troops.html', 'profile.html', 'warnings.html'].forEach((href) => {
        document.querySelectorAll(`.tab-buttons .tab-btn[href="${href}"]`).forEach((link) => {
          if (href !== 'warnings.html') link.style.display = isVisible ? '' : 'none';
          // warnings tab always visible since we're on it, but gate content behind login
        });
      });
    };
    if (token && email) {
      setRestrictedTabsVisibility(true);
      const bankTab = document.getElementById('bankTabBtn');
      if (bankTab) bankTab.style.display = 'flex';
    } else {
      setRestrictedTabsVisibility(false);
      const bankTab = document.getElementById('bankTabBtn');
      if (bankTab) bankTab.style.display = 'none';
      // Add Sign In button to nav if not present
      let nav = document.querySelector('.tab-nav-container');
      if (nav && !document.getElementById('signInManageBtn')) {
        const btn = document.createElement('button');
        btn.id = 'signInManageBtn';
        btn.textContent = '🔑 Sign in to Manage';
        btn.style = 'margin-left:16px;padding:8px 18px;background:#6c5ce7;color:#fff;border:none;border-radius:5px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.2s;';
        btn.onclick = showGoogleLogin;
        nav.appendChild(btn);
      }
    }
  }

  function showGoogleLogin() {
    const loginDiv = document.createElement('div');
    loginDiv.id = 'login-overlay';
    loginDiv.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;';
    loginDiv.innerHTML = `
      <div style="background:#f0f2f5;padding:32px 24px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.5);display:flex;flex-direction:column;align-items:center;gap:16px;min-width:300px;border:1px solid #c0c4d8;">
        <h2 style="margin-bottom:8px;color:#4f46e5;">Sign in to Manage</h2>
        <p style="font-size:14px;color:#2c2f45;text-align:center;margin:0 0 8px 0;">Use your Google account to access warning management</p>
        <div id="g_id_onload" data-client_id="${SITE_CONFIG ? SITE_CONFIG.googleClientId : ''}" data-callback="onGoogleSignIn" data-auto_prompt="false" data-ux_mode="popup"></div>
        <div id="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin" data-shape="rectangular" data-logo_alignment="left"></div>
        <div style="width:100%;height:1px;background:#c0c4d8;margin:8px 0;"></div>
        <button id="cancel-login-btn" style="width:100%;margin-top:8px;padding:12px 20px;border:1px solid #c0c4d8;background:#f0f2f5;color:#4f46e5;font-size:15px;font-weight:600;border-radius:6px;cursor:pointer;">Cancel</button>
        <div id="login-error" style="color:#ff5252;font-size:13px;display:none;"></div>
      </div>
    `;
    document.body.appendChild(loginDiv);
    setTimeout(() => {
      const cancelBtn = document.getElementById('cancel-login-btn');
      if (cancelBtn) {
        cancelBtn.onclick = function() { document.getElementById('login-overlay').remove(); };
      }
      if (window.google && google.accounts && google.accounts.id) {
        try {
          google.accounts.id.initialize({
            client_id: SITE_CONFIG ? SITE_CONFIG.googleClientId : '',
            callback: onGoogleSignIn,
            auto_select: false,
            ux_mode: 'popup'
          });
          google.accounts.id.renderButton(document.getElementById('g_id_signin'),
            { type: 'standard', size: 'large', theme: 'outline', text: 'signin', shape: 'rectangular', logo_alignment: 'left' });
        } catch (e) { console.error('Error rendering Google Sign-In button:', e); }
      }
    }, 100);
  }

  window.onGoogleSignIn = async function(response) {
    const idToken = response.credential;
    try {
      const cfWorkerUrl = window.CLOUDFLARE_WORKER_URL || window.GAS_WEB_APP_URL;
      let tokenRes = await fetch(cfWorkerUrl, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken })
      });
      let tokenData = await tokenRes.json();
      if (!tokenData.success || !tokenData.token_verified) {
        throw new Error(tokenData.error || 'Token verification failed');
      }
      const email = tokenData.email;
      const res = await fetch(BACKEND_VERIFY_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'verifyUserPermission', email })
      });
      const data = await res.json();
      const isAllowed = Boolean(data && (data.isAllowedEditor === true || data.allowed === true));
      if (isAllowed) {
        try { localStorage.setItem(AUTH_KEY, idToken); } catch (e) {}
        try { localStorage.setItem(AUTH_EMAIL_KEY, email); } catch (e) {}
        isLoggedIn = true;
        currentUser = { email: email };
        updateLoginUI();
        const overlay = document.getElementById('login-overlay');
        if (overlay) overlay.remove();
        showToast('Logged in as ' + email, 'success');
      } else {
        const errorDiv = document.getElementById('login-error');
        if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'Your account does not have editor access'; }
      }
    } catch (error) {
      console.error('Error during sign-in:', error);
      const errorDiv = document.getElementById('login-error');
      if (errorDiv) { errorDiv.style.display = 'block'; errorDiv.textContent = 'Sign-in failed: ' + error.message; }
    }
  };

  function handleLogout() {
    isLoggedIn = false; currentUser = null;
    try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
    try { localStorage.removeItem(AUTH_EMAIL_KEY); } catch (e) {}
    window.location.href = 'dashboard.html';
  }

  function updateLoginUI() {
    const badge = document.getElementById('signedInUserBadge');
    const logoutBtn = document.getElementById('logoutBtn');
    const signInBtn = document.getElementById('signInManageBtn');
    if (badge) {
      badge.textContent = isLoggedIn ? currentUser.email : '';
      badge.style.display = isLoggedIn ? 'inline-block' : 'none';
    }
    if (logoutBtn) logoutBtn.style.display = isLoggedIn ? 'inline-block' : 'none';
    if (signInBtn) signInBtn.style.display = isLoggedIn ? 'none' : 'inline-block';
    document.getElementById('loginGate').style.display = isLoggedIn ? 'none' : 'block';
    document.getElementById('mainContent').style.display = isLoggedIn ? 'block' : 'none';
    if (isLoggedIn) loadAllData();
  }

  // ===== DATA LOADING =====
  async function loadAllData() {
    try {
      const [members, types, warnings] = await Promise.all([
        callFunction('getAllMembers'),
        callFunction('getWarningTypes'),
        callFunction('getWarnings')
      ]);

      // Populate member dropdown
      memberNames = (members || []).map(m => typeof m === 'string' ? m : (m.name || '')).filter(n => n).sort();
      const memberSelect = document.getElementById('warnMember');
      const filterMember = document.getElementById('filterMember');
      memberSelect.innerHTML = '<option value="">-- Select Member --</option>';
      filterMember.innerHTML = '<option value="">All Members</option>';
      memberNames.forEach(name => {
        memberSelect.innerHTML += '<option value="' + esc(name) + '">' + esc(name) + '</option>';
        filterMember.innerHTML += '<option value="' + esc(name) + '">' + esc(name) + '</option>';
      });

      // Populate warning types
      warningTypes = types || [];
      const typeSelect = document.getElementById('warnType');
      const filterType = document.getElementById('filterType');
      typeSelect.innerHTML = '<option value="">-- Select Reason --</option>';
      filterType.innerHTML = '<option value="">All Types</option>';
      warningTypes.forEach(t => {
        typeSelect.innerHTML += '<option value="' + esc(t) + '">' + esc(t) + '</option>';
        filterType.innerHTML += '<option value="' + esc(t) + '">' + esc(t) + '</option>';
      });

      document.getElementById('submitWarnBtn').disabled = false;
      document.getElementById('autoGenBtn').disabled = false;

      // Process warnings
      if (warnings && warnings.success) {
        allWarnings = warnings.warnings || [];
        warningSummary = warnings.summary || {};
      }

      renderSummary();
      renderHistory();
      autoSetWarningNumber();
    } catch (err) {
      showToast('Failed to load data: ' + err.message, 'error');
    }
  }

  // ===== AUTO-SET WARNING NUMBER =====
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('warnMember').addEventListener('change', autoSetWarningNumber);
  });

  function autoSetWarningNumber() {
    const member = document.getElementById('warnMember').value;
    if (!member) return;
    const s = warningSummary[member];
    const nextNum = s ? s.maxWarningNum + 1 : 1;
    const sel = document.getElementById('warnNumber');
    sel.value = String(Math.min(nextNum, 5));
  }

  // ===== SUBMIT WARNING =====
  async function submitWarning() {
    const member = document.getElementById('warnMember').value;
    const warningNumber = document.getElementById('warnNumber').value;
    const type = document.getElementById('warnType').value;
    const comment = document.getElementById('warnComment').value.trim();
    const statusEl = document.getElementById('formStatus');

    if (!member) { statusEl.innerHTML = '<span style="color:#ff5252">Please select a member.</span>'; return; }
    if (!type) { statusEl.innerHTML = '<span style="color:#ff5252">Please select a reason.</span>'; return; }

    const btn = document.getElementById('submitWarnBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    statusEl.innerHTML = '';

    try {
      const result = await callFunction('addWarning', [{
        member: member,
        warningNumber: parseInt(warningNumber),
        type: type,
        comment: comment,
        issuedBy: currentUser ? currentUser.email : ''
      }]);

      if (result && result.success) {
        showToast(result.message, 'success');
        document.getElementById('warnComment').value = '';
        document.getElementById('warnType').value = '';
        const warnings = await callFunction('getWarnings');
        if (warnings && warnings.success) {
          allWarnings = warnings.warnings || [];
          warningSummary = warnings.summary || {};
        }
        renderSummary();
        renderHistory();
        autoSetWarningNumber();
      } else {
        showToast('Error: ' + (result ? result.message : 'Unknown'), 'error');
      }
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '⚠️ Issue Warning';
    }
  }

  // ===== DELETE WARNING =====
  async function deleteWarningClick(rowIndex) {
    if (!confirm('Delete this warning? This cannot be undone.')) return;
    try {
      const result = await callFunction('deleteWarning', [rowIndex]);
      if (result && result.success) {
        showToast('Warning deleted', 'success');
        const warnings = await callFunction('getWarnings');
        if (warnings && warnings.success) {
          allWarnings = warnings.warnings || [];
          warningSummary = warnings.summary || {};
        }
        renderSummary();
        renderHistory();
      } else { showToast('Delete failed', 'error'); }
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  }

  // ===== RENDER SUMMARY =====
  let summarySortCol = 'level';
  let summarySortAsc = false;

  function renderSummary() {
    const grid = document.getElementById('summaryGrid');
    let entries = Object.entries(warningSummary).filter(([name]) => memberNames.includes(name));
    document.getElementById('summaryCount').textContent = entries.length;
    if (entries.length === 0) {
      grid.innerHTML = '<div class="no-data">No warnings issued yet. 🎉</div>';
      return;
    }

    entries.sort((a, b) => {
      let va, vb;
      if (summarySortCol === 'name') { va = a[0].toLowerCase(); vb = b[0].toLowerCase(); return summarySortAsc ? va.localeCompare(vb) : vb.localeCompare(va); }
      if (summarySortCol === 'level') { va = a[1].maxWarningNum; vb = b[1].maxWarningNum; }
      else if (summarySortCol === 'count') { va = a[1].count; vb = b[1].count; }
      else if (summarySortCol === 'date') { va = a[1].latestDate; vb = b[1].latestDate; return summarySortAsc ? (va > vb ? 1 : -1) : (vb > va ? 1 : -1); }
      else { va = a[1].maxWarningNum; vb = b[1].maxWarningNum; }
      return summarySortAsc ? va - vb : vb - va;
    });

    const arrow = (col) => '<span class="sort-arrow">' + (summarySortCol === col ? (summarySortAsc ? '▲' : '▼') : '⇅') + '</span>';
    const sorted = (col) => summarySortCol === col ? ' sorted' : '';

    let html = '<table class="summary-table"><thead><tr>' +
      '<th class="' + sorted('name') + '" onclick="sortSummary(\'name\')">' + 'Member' + arrow('name') + '</th>' +
      '<th class="' + sorted('level') + '" onclick="sortSummary(\'level\')" style="text-align:center">' + 'Level' + arrow('level') + '</th>' +
      '<th class="' + sorted('count') + '" onclick="sortSummary(\'count\')" style="text-align:center">' + 'Total' + arrow('count') + '</th>' +
      '<th>' + 'Reasons</th>' +
      '<th class="' + sorted('date') + '" onclick="sortSummary(\'date\')">' + 'Latest' + arrow('date') + '</th>' +
      '<th style="width:70px"></th>' +
      '</tr></thead><tbody>';

    entries.forEach(([name, data]) => {
      const wClass = data.maxWarningNum >= 4 ? 'w4' : data.maxWarningNum >= 3 ? 'w3' : data.maxWarningNum >= 2 ? 'w2' : 'w1';
      html += '<tr>' +
        '<td style="font-weight:600">' + esc(name) + '</td>' +
        '<td style="text-align:center"><span class="warn-badge ' + wClass + '">' + data.maxWarningNum + '</span></td>' +
        '<td style="text-align:center">' + data.count + '</td>' +
        '<td class="type-tags">' + data.types.map(t => esc(t)).join(', ') + '</td>' +
        '<td style="font-size:0.82em">' + data.latestDate + '</td>' +
        '<td><div class="action-btns">' +
          '<button onclick="filterByMember(\'' + esc(name) + '\')" title="View history">📜</button>' +
          '<button class="clear-btn" onclick="clearMemberWarningsClick(\'' + esc(name) + '\')" title="Clear all">🧹</button>' +
        '</div></td></tr>';
    });

    html += '</tbody></table>';
    grid.innerHTML = html;
  }

  function sortSummary(col) {
    if (summarySortCol === col) { summarySortAsc = !summarySortAsc; }
    else { summarySortCol = col; summarySortAsc = col === 'name'; }
    renderSummary();
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.content-tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    const btns = document.querySelectorAll('.content-tabs button');
    const idx = tab === 'overview' ? 0 : tab === 'issue' ? 1 : 2;
    btns[idx].classList.add('active');
  }

  function filterByMember(name) {
    document.getElementById('filterMember').value = name;
    renderHistory();
    switchTab('history');
  }

  // ===== RENDER HISTORY =====
  function renderHistory() {
    const memberFilter = document.getElementById('filterMember').value;
    const typeFilter = document.getElementById('filterType').value;
    const list = document.getElementById('warnList');

    let filtered = allWarnings.filter(w => memberNames.includes(w.member));
    if (memberFilter) filtered = filtered.filter(w => w.member === memberFilter);
    if (typeFilter) filtered = filtered.filter(w => w.type === typeFilter);

    if (filtered.length === 0) {
      list.innerHTML = '<li class="no-data">No warnings match the current filter.</li>';
      return;
    }

    let html = '';
    filtered.forEach(w => {
      const wClass = w.warningNumber >= 4 ? 'w4' : w.warningNumber >= 3 ? 'w3' : w.warningNumber >= 2 ? 'w2' : 'w1';
      html += '<li class="warn-item">' +
        '<button class="delete-btn" onclick="deleteWarningClick(' + w.rowIndex + ')" title="Delete">🗑️</button>' +
        '<div class="warn-header">' +
          '<span class="warn-num ' + wClass + '">#' + w.warningNumber + '</span>' +
          '<span class="warn-name">' + esc(w.member) + '</span>' +
          '<span class="warn-type">' + esc(w.type) + '</span>' +
        '</div>' +
        '<div class="warn-detail">📅 ' + w.timestamp + (w.issuedBy ? ' &middot; by ' + esc(w.issuedBy) : '') + '</div>' +
        (w.comment ? '<div class="warn-comment">"' + esc(w.comment) + '"</div>' : '') +
        '</li>';
    });
    list.innerHTML = html;
  }

  // ===== CLEAR MEMBER WARNINGS =====
  async function clearMemberWarningsClick(memberName) {
    if (!confirm('Clear ALL warnings for "' + memberName + '"? This cannot be undone.')) return;
    try {
      const result = await callFunction('clearMemberWarnings', [memberName]);
      if (result && result.success) {
        showToast(result.message, 'success');
        const warnings = await callFunction('getWarnings');
        if (warnings && warnings.success) {
          allWarnings = warnings.warnings || [];
          warningSummary = warnings.summary || {};
        }
        renderSummary();
        renderHistory();
      } else { showToast('Error: ' + (result ? result.message : 'Unknown'), 'error'); }
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  }

  // ===== AUTO-GENERATE TARGET WARNINGS =====
  async function autoGenTargetWarnings() {
    const btn = document.getElementById('autoGenBtn');
    btn.disabled = true;
    btn.textContent = 'Processing...';
    try {
      const result = await callFunction('autoGenerateTargetWarnings', [currentUser ? currentUser.email : '']);
      if (result && result.success) {
        let msg = result.message;
        if (result.added && result.added.length > 0) msg += ': ' + result.added.join(', ');
        showToast(msg, 'success');
        const warnings = await callFunction('getWarnings');
        if (warnings && warnings.success) {
          allWarnings = warnings.warnings || [];
          warningSummary = warnings.summary || {};
        }
        renderSummary();
        renderHistory();
      } else {
        showToast('Error: ' + (result ? result.message : 'Unknown'), 'error');
      }
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '\uD83C\uDFAF Auto-warn Custom Targets';
    }
  }

  // ===== HELPERS =====
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '');
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3500);
  }

  // ===== INIT =====
  document.addEventListener('DOMContentLoaded', checkLoginState);
</script>
</body>
</html>
